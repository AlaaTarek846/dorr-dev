org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# No org.gradle.java.home here: it's a path on one machine and breaks every other one.
# Android Studio passes its own JDK; to pin one, put it in your user file instead
# (%USERPROFILE%\.gradle\gradle.properties), which isn't committed.
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The Kotlin compile daemon prints "is ready" then exits 0 on this setup; Gradle
# treats that as a crash. Compiling inside Gradle's process skips that loop.
kotlin.compiler.execution.strategy=in-process
