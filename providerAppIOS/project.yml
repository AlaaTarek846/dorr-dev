# XcodeGen spec — the .xcodeproj is generated from this file and is not committed.
#   brew install xcodegen && cd providerAppIOS && xcodegen
# The iOS twin of providerApp/ («شركاء دُرر» / Dorr Partners): the service establishments' app on the `provider_api` guard
# (/api/provider/v1/*), separate from the client app (iosApp/) and the freelancer app (freelanceAppIOS/), exactly as
# providerApp is separate on Android.
name: DorrPartners
options:
  bundleIdPrefix: com.dorr
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ar
  createIntermediateGroups: true
  projectFormat: xcode15_0
configFiles:
  Debug: Config/DorrPartners.xcconfig
  Release: Config/DorrPartners.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    # providerApp: versionName 0.1.0, versionCode 1.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GoogleMaps:
    # The map engine the admin picks — Google (Android: play-services-maps / maps-compose), as driverAppIos.
    url: https://github.com/googlemaps/ios-maps-sdk
    from: 9.4.0
  MapboxMaps:
    # …or Mapbox — the same release as Android (11.8.0); newer ones need Xcode 16. (Apple Maps is MapKit, built in.)
    url: https://github.com/mapbox/mapbox-maps-ios.git
    exactVersion: 11.8.0
  PusherSwift:
    # The live connection (Android: pusher-java-client), settings from `provider/v1/realtime-config`.
    url: https://github.com/pusher/pusher-websocket-swift
    exactVersion: 10.1.5
  OneSignal:
    # Push notifications (Android: OneSignal 5.1.x), the app id from `realtime-config`.
    url: https://github.com/OneSignal/OneSignal-XCFramework
    exactVersion: 5.2.10
targets:
  DorrPartners:
    type: application
    platform: iOS
    sources:
      - path: DorrPartners
    dependencies:
      - package: GoogleMaps
        products: [GoogleMaps]
      - package: MapboxMaps
        product: MapboxMaps
      - package: PusherSwift
        product: PusherSwift
      - package: OneSignal
        products: [OneSignalFramework]
    preBuildScripts:
      # providerApp's strings → Localizable.strings, so a build never ships stale text.
      - name: Sync strings from providerApp
        script: python3 "$SRCROOT/scripts/sync_strings.py"
        basedOnDependencyAnalysis: false
    settings:
      base:
        INFOPLIST_FILE: DorrPartners/Info.plist
        CODE_SIGN_ENTITLEMENTS: DorrPartners/DorrPartners.entitlements
        OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -solver-expression-time-threshold=60"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
