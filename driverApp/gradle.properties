org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# No org.gradle.java.home here: it's a path on one machine and breaks every other one.
# Android Studio passes its own JDK; to pin one, put it in your user file instead
# (%USERPROFILE%\.gradle\gradle.properties), which isn't committed.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The Kotlin compile daemon often can't be reached on this machine; Gradle then retries before
# falling back. Compiling inside Gradle's own process skips that wait.
kotlin.compiler.execution.strategy=in-process
